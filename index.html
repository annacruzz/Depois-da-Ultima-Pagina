
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <title>Jogo de Organização de Livros</title>

    
    
</head>
<body>

    <h1>📚 Jogo de Organização de Livros</h1>

    <div class="score-board">
        Pontuação: <span id="score">0</span>
    </div>

    <!-- Área dos livros -->
    <div class="books-container" id="books-container">
        <!-- Os livros serão adicionados pelo JavaScript -->
    </div>

    <!-- Estantes -->
    <div class="shelves-grid">

        <div class="shelf" data-category="Romance">
            <div class="shelf-icon">❤️</div>
            <h2 class="shelf-title">Romance</h2>
            <p class="shelf-desc">Livros de histórias românticas</p>
            <div class="shelf-content"></div>
        </div>

        <div class="shelf" data-category="Ciências">
            <div class="shelf-icon">🔬</div>
            <h2 class="shelf-title">Ciências</h2>
            <p class="shelf-desc">Livros científicos e descobertas</p>
            <div class="shelf-content"></div>
        </div>

        <div class="shelf" data-category="Fantasia">
            <div class="shelf-icon">🧙</div>
            <h2 class="shelf-title">Fantasia</h2>
            <p class="shelf-desc">Livros de magia e aventuras</p>
            <div class="shelf-content"></div>
        </div>

        <div class="shelf" data-category="História">
            <div class="shelf-icon">🏛️</div>
            <h2 class="shelf-title">História</h2>
            <p class="shelf-desc">Livros sobre acontecimentos históricos</p>
            <div class="shelf-content"></div>
        </div>

    </div>

    <!-- Modal de fim de jogo -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>🎉 Parabéns!</h2>
            <p>Você organizou todos os livros!</p>
            <button id="restart-button">Jogar novamente</button>
        </div>
    </div>
<script src="script.js" defer></script>
</body>
</html>
