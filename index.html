<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Organização de Livros</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333;
            --romance-color: #ffebee;
            --ciencias-color: #e8f5e9;
            --fantasia-color: #f3e5f5;
            --historia-color: #fff3e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Área dos livros para arrastar */
        .books-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-height: 80px;
            width: 100%;
            max-width: 900px;
            padding: 15px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .book {
            background-color: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: grab;
            user-select: none;
            font-weight: 600;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }

        .book.selected {
            border-color: var(--primary-color);
            background-color: #e3f2fd;
        }

        /* Estantes */
        .shelves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .shelf {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            min-height: 180px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px dashed #bbb;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .shelf.drag-over {
            border-color: var(--primary-color);
            background-color: #eef5fc;
        }

        .shelf-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .shelf-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0;
        }

        .shelf-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        .shelf-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .shelf[data-category="Romance"] { background-color: var(--romance-color); }
        .shelf[data-category="Ciências"] { background-color: var(--ciencias-color); }
        .shelf[data-category="Fantasia"] { background-color: var(--fantasia-color); }
        .shelf[data-category="História"] { background-color: var(--historia-color); }

        /* Modal de Fim de Jogo */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
